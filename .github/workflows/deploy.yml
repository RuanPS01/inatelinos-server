name: Deploy Firebase config

# Publica regras e índices do Firebase automaticamente ao dar merge na main.
# Só roda quando algum arquivo de configuração muda.
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {} # permite disparo manual pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Autenticar no Firebase (service account)
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Firestore (regras + índices) funciona no plano gratuito (Spark).
      - name: Deploy das regras e índices do Firestore
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      # O Storage exige que o bucket já tenha sido inicializado no console
      # (Storage → Get Started). Em projetos novos, essa ativação pode pedir o
      # plano Blaze. Enquanto o Storage não estiver ativo, este passo apenas
      # avisa — sem derrubar o pipeline do Firestore.
      - name: Deploy das regras do Storage (opcional)
        continue-on-error: true
        run: |
          if firebase deploy \
            --only storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive; then
            echo "✅ Regras do Storage publicadas."
          else
            echo "::warning::Storage ainda não ativado neste projeto. Ative em" \
              "Firebase Console → Storage → Get Started e rode o workflow de novo." \
              "Firestore já foi publicado com sucesso."
          fi
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
